apply plugin: 'java-library'

description = 'Directory that reads through a shared Caffeine cache of off-heap blocks'

dependencies {
  moduleApi project(':lucene:core')
  // Caffeine's only transitive dependencies are compile-time annotations (checker-qual, error_prone_annotations).
  moduleApi(deps.caffeine) {
    transitive = false
  }

  moduleTestImplementation project(':lucene:test-framework')
}

// Lets the test security policy (gradle/testing/randomization/policies/tests.policy) grant Caffeine
// and this module the reflective access Caffeine's static initializers need.
tasks.withType(Test).configureEach {
  def runtimeClasspath = configurations.testRuntimeClasspath
  def moduleBuildDir = layout.buildDirectory.get().asFile.absolutePath
  jvmArgumentProviders.add({ ->
    [
      "-Dcaffeine.jar=" + runtimeClasspath.find { it.name.startsWith("caffeine-") }.absolutePath,
      "-Dlucene.bufferpool=" + moduleBuildDir
    ]
  } as CommandLineArgumentProvider)
}
